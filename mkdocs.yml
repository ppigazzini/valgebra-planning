site_name: valgebra-planning
site_description: Plans of tool calls for agents, proven well-typed for every output the tool contracts admit.
site_url: https://ppigazzini.github.io/valgebra-planning/
repo_url: https://github.com/ppigazzini/valgebra-planning
repo_name: ppigazzini/valgebra-planning
copyright: Dual-licensed MIT OR Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - The command line: command-line.md
      - Code mode: code-mode.md
      - Recipes: recipes.md
  - Release notes: changelog.md
  - Explanation:
      - The method: method.md
      - Results: results.md
  - Reference:
      - Python API: api.md
      - Works cited: references.md

# The developer set lives beside the user docs and is not published: how a release reaches
# PyPI and the rules for every text, which describe the tree for a contributor and an agent
# rather than the package for its user. Excluding it keeps --strict honest: every page left is
# in the nav above. The study files are what the commands on the results page check.
exclude_docs: |
  dev/
  studies/

# Every check the builder makes on a link and on the nav, raised to a warning so that --strict
# fails the build on it: a page or an anchor a link names that does not exist, a page under
# docs/ that no nav entry lists, and a link MkDocs cannot read as one to a page.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Include a file from outside docs/ verbatim, so the release notes the site serves are the
  # changelog the repository keeps rather than a second list nothing holds to the first.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  # A page the site has served at another address answers there still: a page that sends the
  # reader on to where it lives now, with the anchor the link named where the browser runs
  # scripts. An entry stays as long as the site does, since links to the old address do.
  - redirects:
      redirect_maps:
        00-using.md: command-line.md
        01-method.md: method.md
        02-api.md: api.md
        03-code-mode.md: code-mode.md
        04-results.md: results.md
        11-references.md: references.md
        12-changelog.md: changelog.md
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            # A module's public names are its `__all__`, as docs/api.md lists them.
            filters: public
            # A public name with no docstring of its own, a constant or an alias, is still one.
            show_if_no_docstring: true
            heading_level: 3
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  # Machine-readable view of the site: /llms.txt (a manifest mirroring the nav) and
  # /llms-full.txt (the full content). Runs last, so it reads the API reference mkdocstrings
  # renders.
  - llmstxt:
      markdown_description: >-
        Plans of tool calls for agents, proven well-typed for every output the tool contracts
        admit. A tool's MCP inputSchema and outputSchema are read by valgebra-jsonschema into
        valgebra's sets; a program of calls and type tests is accepted only where every value
        it passes on is proven inside the argument it fills. A program written elsewhere, by
        hand or by a language model, is verified the same way, link by link.
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md: What valgebra-planning is, how it rests on valgebra and valgebra-jsonschema, and where to start.
          - command-line.md: Plan a library's tasks, critique a program, run one against a live server, or serve the proxy, from the command line.
          - code-mode.md: A model's program proven before it runs and run so the proof holds, and the two kinds of check the proxy holds.
          - recipes.md: Tasks done end to end over tool listings in hand -- a model's program checked before it runs, a server answering outside its contract, an approval a policy requires, a notice held to the address on file, a privilege update, and a policy that cannot fire.
        Release notes:
          - changelog.md: Every released version, what it changed, and what counts as a break.
        Explanation:
          - method.md: Contracts, the cells, the planner, the verifier, the rules a program is held to, the critic, and the limits.
          - results.md: The studies, each count with the command that checks it.
        Reference:
          - api.md: The public modules, the names each promises, the two needing the mcp extra, and their reference read from the docstrings.
          - references.md: Every work the method and the modules cite, under its key.
