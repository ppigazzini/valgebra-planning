minimum_pre_commit_version: "4.0.0"
# `pre-commit install` sets both hooks: the files at a commit, its message after.
default_install_hook_types: [pre-commit, commit-msg]
# A hook naming no stage runs on the files alone, never on the message.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        # mkdocs.yml names the Mermaid fence's formatter by a Python tag, which a safe load
        # refuses; the hook checks the syntax, and the site build loads the file.
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: docs-lint
        name: every tracked text against docs/dev/writing.md
        entry: uv run --no-sync python tools/docs_lint.py
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-msg
        name: the commit message, its form and no trailer
        entry: uv run --no-sync python tools/docs_lint.py --commit-msg
        language: system
        stages: [commit-msg]
