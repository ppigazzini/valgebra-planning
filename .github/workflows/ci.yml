name: CI

# A push to `main` or `github_ci` runs the job, and so do a pull request into `main` and a
# manual dispatch. A tag or another branch runs nothing: the commit a tag names ran on the
# branch that carries it.
on:
  push:
    branches: [main, github_ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The job reads the repository and writes nothing back.
permissions:
  contents: read

# A newer push to the same ref supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Every commit's message is checked, so the whole history is fetched.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: true }
      - run: uv lock --check
      - run: uv sync --locked
      # The gate `AGENTS.md` lists, in its order; `tests/test_build_surfaces.py` holds them equal.
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check
      - run: uv run --no-sync python tools/docs_lint.py
      - run: uv run --no-sync python tools/docs_lint.py --commits
      - run: uv run --no-sync python -X warn_default_encoding -m pytest
      # Every published count is one this code still produces.
      - run: uv run --no-sync python tools/case.py examples/parcels --check docs/studies/parcels.json
      - run: uv run --no-sync python tools/case.py examples/robot-skills --check docs/studies/robot-skills.json
      - run: uv run --no-sync python tools/bench.py --check docs/studies/bench.json
      - run: uv run --no-sync python tools/faults.py examples/bookings --check docs/studies/faults.json

  # The suite on every interpreter the classifiers name, as valgebra's push runs its own: on
  # Linux at each one below the newest, which `test` runs, and on macOS and Windows at the
  # newest, so a defect one platform alone reaches fails the push rather than the release smoke.
  suite:
    name: the suite on ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-26, python: "3.15" }
          - { os: windows-2025-vs2026, python: "3.15" }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "${{ matrix.python }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run --no-sync python -X warn_default_encoding -m pytest

  # The wheel a user installs, built as the release builds it, installed in an environment
  # holding nothing else, bare and with `[mcp]`, every module imported with every warning an
  # error and the command line asked for its help, as valgebra's push installs its own: a
  # wheel that builds and does not load fails the push rather than the release smoke. The
  # release smokes the wheel and the sdist on every platform and at the floors.
  wheel:
    name: the wheel, installed and imported
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: true }
      - run: |
          uv export --locked --only-group build --no-emit-project -o "$RUNNER_TEMP/build.txt"
          uv build --wheel --no-sources --build-constraints "$RUNNER_TEMP/build.txt" --require-hashes
      - run: |
          set -euo pipefail
          wheel="$PWD/$(ls dist/*.whl)"
          bin="$RUNNER_TEMP/installed/bin"
          # `python -c` puts the working directory first on the path, and the root holds the
          # package: each import runs outside the tree, or it reads the checkout.
          cd "$RUNNER_TEMP"
          uv venv "$RUNNER_TEMP/installed"
          uv pip install --python "$RUNNER_TEMP/installed" "$wheel"
          uv pip check --python "$RUNNER_TEMP/installed"
          "$bin/python" -W error -c 'import importlib, importlib.util, pkgutil, valgebra_planning as m; assert importlib.util.find_spec("mcp") is None; assert "site-packages" in m.__file__, m.__file__; [importlib.import_module(f"valgebra_planning.{n.name}") for n in pkgutil.iter_modules(m.__path__) if n.name not in {"servers", "proxy"}]'
          "$bin/valgebra-planning" --help > /dev/null
          uv pip install --python "$RUNNER_TEMP/installed" "$wheel[mcp]"
          uv pip check --python "$RUNNER_TEMP/installed"
          "$bin/python" -W error -c 'import importlib, importlib.metadata as md, pkgutil, valgebra_planning as m; [importlib.import_module(f"valgebra_planning.{n.name}") for n in pkgutil.iter_modules(m.__path__)]; print("wheel ok", md.version("valgebra-planning"), "on valgebra", md.version("valgebra"), "and valgebra-jsonschema", md.version("valgebra-jsonschema"))'
          "$bin/valgebra-planning" --help > /dev/null

  docs:
    name: the site, built strict
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The workflow `Docs` publishes the site from `main` only; this builds it on every push, so
    # a dead link, a dead anchor or a page off the nav fails here before it is published.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: true }
      - run: uv sync --locked --group docs
      - run: uv run --no-sync zensical build --strict

  actions-lock:
    name: the actions lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # `.github/workflows/actions.lock` names the commit every action a workflow runs resolves
    # to, an action another action calls included, and the runner runs that commit. This reads
    # the file against the workflows and against upstream: a `uses:` with no entry, or a tag
    # moved off its locked commit, fails here.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the lockfile checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  zizmor:
    name: the workflow audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Static analysis of the workflows themselves: template injection, credential persistence,
    # over-broad permissions and unpinned actions.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: false }
      - name: Audit the workflows
        # The token lets zizmor resolve each action's ref, beside the static audits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.33.1 .github/

  api:
    name: the public API against the last release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Each public name removed or changed since the last tag, as griffe reads it from every
    # module's `__all__`, stands under Changed or Removed among the changelog's entries since
    # that tag, as the releasing page asks before a dispatch. Under 0.0.x a release may break any
    # name, so the job holds the record, not the name: `tools/api_changes.py` prints each change
    # as an annotation and fails on one the changelog does not record.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # griffe loads the tag from git, so the history and its tags are fetched.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: false }
      - run: uv sync --locked
      - name: Hold the changelog to the API's changes since the last tag
        run: |
          set -euo pipefail
          if git describe --tags --abbrev=0 --match 'v*' > /dev/null 2>&1; then
            uv run --no-sync python tools/api_changes.py
          else
            echo "no release tag yet: nothing to compare"
          fi

  pip-audit:
    name: the dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Every locked Python dependency, of the package and of each group, against the PyPI
    # advisory database. pip-audit reads the lock as a PEP 751 file: it installs nothing, and
    # it reads every package, one whose marker excludes this runner included. `--strict` fails
    # the job on a package it cannot audit, where a plain run would only skip it.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: false }
      - name: Audit the locked dependencies
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/audit"
          uv export --locked --format pylock.toml --no-emit-project --all-groups -o "$RUNNER_TEMP/audit/pylock.toml"
          uvx pip-audit==2.10.1 --strict --locked "$RUNNER_TEMP/audit"
