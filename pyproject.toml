[project]
name = "valgebra-planning"
version = "0.0.1"
description = "Plans of tool calls proven well-typed for every output the tool contracts admit, decided by valgebra's sets."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Pasquale Pigazzini" }]
requires-python = ">=3.11"
keywords = ["planning", "verification", "mcp", "agents", "valgebra", "json-schema"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    # The decision procedure every proof here rests on. Pre-alpha, so pinned below 0.1,
    # and a 0.0.x minor is a breaking release: the floor moves with each release.
    "valgebra>=0.0.25,<0.1",
    # JSON Schema and MCP tool listings read into valgebra's sets. Pre-alpha as valgebra is,
    # so pinned below 0.1. Not on an index yet, so the source below pins a commit.
    "valgebra-jsonschema>=0.0.1,<0.1",
]

[project.optional-dependencies]
# A live MCP server, read and called through the protocol's own client: `valgebra_planning.servers`.
mcp = ["mcp>=2.3.0,<3"]

[project.scripts]
valgebra-planning = "valgebra_planning.cli:main"

[project.urls]
Repository = "https://github.com/ppigazzini/valgebra-planning"
Documentation = "https://github.com/ppigazzini/valgebra-planning/tree/main/docs"
Changelog = "https://github.com/ppigazzini/valgebra-planning/blob/main/CHANGELOG.md"
Issues = "https://github.com/ppigazzini/valgebra-planning/issues"

[tool.uv.sources]
valgebra-jsonschema = { git = "https://github.com/ppigazzini/valgebra-jsonschema", rev = "f9ee61df512ce89adbc6c24c97051aac698a161b" }

[dependency-groups]
# What the suite imports beside the package. The release smoke installs this group alone
# beside the built artifact, so a module the suite needs and no group names fails there.
test = [
    "hypothesis>=6.170.15",
    # The `mcp` extra's client and server: the live-server and proxy tests run on it.
    "mcp>=2.3.0,<3",
    "pytest>=9.2.0",
]
dev = [
    { include-group = "test" },
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
# The backend `[build-system]` names, at the lock's version and hashes: the release workflow
# builds the published artifacts with it alone, so a backend release reaches them only through
# a lock update.
build = ["hatchling>=1.33.0"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valgebra_planning"]

# The package, its suite and what the suite reads: the examples, the pages and `tools/`, whose
# lint and bench driver it imports, beside the README, the licenses and this file, which every
# sdist carries. The test holding `AGENTS.md` to the workflow stays out with the two files it
# reads.
[tool.hatch.build.targets.sdist]
include = ["valgebra_planning", "tests", "examples", "docs", "tools", "CHANGELOG.md"]
exclude = ["tests/test_build_surfaces.py"]

[tool.hatch.metadata]
# The git source of valgebra-jsonschema above; an index release replaces it.
allow-direct-references = true

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true

[tool.ty.environment]
python-version = "3.11"
# `tests/test_reachable.py` imports the bench's library generator.
extra-paths = ["tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- formatter conflicts: ruff-format owns these ---
    "COM812", "ISC001",
    # --- a set is read at runtime, so its names stay imported ---
    "TC001", "TC002", "TC003",
    # --- deliberate ---
    "T201",     # print: the tools ARE command line programs; stdout is their output
    "CPY001",   # missing-copyright-notice: LICENSE covers the tree
    "S311",     # seeded `random.Random` IS the requirement: every draw must reproduce
    "ANN401",   # a JSON value is `Any`: anything `json.loads` returns
    "D105", "D107",
    # --- docstring style: numpy convention ---
    "D203", "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
# `plan` takes each rule a program can be held to as a keyword of its own: errors, policies,
# flows and mined types, beside the depth, the seed and whether a weak program will do.
max-args = 10
max-positional-args = 8
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN", "PLR2004", "INP001", "SLF001", "FBT003"]
"tools/*" = ["INP001"]
"examples/*" = ["INP001", "T201"]
